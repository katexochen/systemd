# Things needed for TEST-94-COCO.

[Match]
Distribution=fedora
Release=rawhide

[Content]
# The vTPM of guests running under an SVSM must be available in the initrd, otherwise
# tpm2.target waits for the device the firmware announced until it times out.
KernelInitrdModules=tpm_svsm
Packages=
        coconut-svsm
        qemu-coconut
